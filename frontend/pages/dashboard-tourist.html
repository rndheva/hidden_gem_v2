<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Wisatawan — Hidden Gem Explorer</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <a href="/" class="nav-logo"><span class="logo-icon">🌊</span><span>Hidden Gem Explorer</span></a>
    <div class="nav-actions" id="navUserArea"></div>
  </div>
</nav>

<div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebarAvatar">T</div>
      <div class="sidebar-name" id="sidebarName">Wisatawan</div>
      <div class="sidebar-role">Tourist</div>
    </div>
    <ul class="sidebar-nav">
      <li><a href="#" class="active" onclick="showTab('bookings',this)"><span class="nav-icon">📋</span> Booking Saya</a></li>
      <li><a href="#" onclick="showTab('explore',this)"><span class="nav-icon">🗺️</span> Jelajahi Destinasi</a></li>
      <li class="sidebar-section-label">Navigasi</li>
      <li><a href="/pages/destinations.html"><span class="nav-icon">🌊</span> Semua Destinasi</a></li>
      <li><a href="/pages/packages.html"><span class="nav-icon">📦</span> Paket Trip</a></li>
    </ul>
  </aside>

  <main class="dashboard-content">
    <!-- BOOKINGS -->
    <div id="tab-bookings">
      <h2 class="dashboard-title">📋 Booking Saya</h2>
      <div id="bookingsList"></div>
    </div>

    <!-- EXPLORE -->
    <div id="tab-explore" style="display:none">
      <h2 class="dashboard-title">🗺️ Destinasi Hidden Gem</h2>
      <div class="grid-3" id="exploreGrid"></div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  if (!requireAuth(['tourist'])) {}

  const user = Auth.getUser();
  document.getElementById('sidebarAvatar').textContent = user?.fullname?.[0] || 'T';
  document.getElementById('sidebarName').textContent   = user?.fullname || 'Wisatawan';

  function showTab(name, el) {
    document.querySelectorAll('[id^="tab-"]').forEach(t => t.style.display = 'none');
    document.getElementById('tab-' + name).style.display = 'block';
    document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.remove('active'));
    if (el) el.classList.add('active');
    if (name === 'bookings') loadBookings();
    if (name === 'explore')  loadExplore();
  }

  const statusColors = {
    pending:   'badge-warning',
    confirmed: 'badge-success',
    cancelled: 'badge-danger',
    completed: 'badge-sand'
  };

  async function loadBookings() {
    const res = await api('/bookings');
    const el  = document.getElementById('bookingsList');
    if (!res.success) { el.innerHTML = '<p>Gagal memuat booking</p>'; return; }
    if (!res.data.length) {
      el.innerHTML = `<div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>Belum ada booking. <a href="/pages/packages.html" style="color:var(--forest);font-weight:600">Cari paket trip sekarang!</a></p>
      </div>`;
      return;
    }
    el.innerHTML = res.data.map(b => `
      <div class="card" style="box-shadow:none;border:1px solid var(--sand-dark);margin-bottom:var(--space-md)">
        <div class="card-body">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px">
            <div>
              <h4 style="color:var(--forest);margin-bottom:4px">${b.package_title}</h4>
              <p style="font-size:.85rem;color:var(--stone);margin-bottom:4px">📍 ${b.destination_name} • ${b.destination_location}</p>
              <p style="font-size:.85rem;color:var(--stone)">📅 ${fmtDate(b.booking_date)} &nbsp;•&nbsp; 👥 ${b.participants} peserta</p>
            </div>
            <div style="text-align:right">
              <span class="badge ${statusColors[b.status] || 'badge-sand'}" style="margin-bottom:8px;display:inline-block">${b.status}</span>
              <div style="font-family:var(--font-display);font-size:1.25rem;color:var(--earth);font-weight:700">${fmtPrice(b.total_price)}</div>
            </div>
          </div>
          ${b.status === 'pending' || b.status === 'confirmed' ? `
          <div style="margin-top:var(--space-md);padding-top:var(--space-md);border-top:1px solid var(--sand)">
            <button class="btn btn-sm" style="background:#DC3545;color:white;border:none;border-radius:20px;padding:6px 16px;cursor:pointer"
              onclick="cancelBooking(${b.id},this)">❌ Batalkan Booking</button>
          </div>` : ''}
        </div>
      </div>`).join('');
  }

  async function cancelBooking(id, btn) {
    if (!confirm('Yakin ingin membatalkan booking ini?')) return;
    btn.disabled = true; btn.textContent = 'Membatalkan...';
    const res = await api(`/bookings/${id}/status`, { method: 'PATCH', body: JSON.stringify({ status: 'cancelled' }) });
    if (res.success) { toast('Booking dibatalkan', 'info'); loadBookings(); }
    else { toast(res.message, 'error'); btn.disabled = false; btn.textContent = '❌ Batalkan Booking'; }
  }

  async function loadExplore() {
    const res = await api('/destinations');
    const grid = document.getElementById('exploreGrid');
    if (!res.success || !res.data.length) { grid.innerHTML = '<p>Gagal memuat destinasi</p>'; return; }
    grid.innerHTML = res.data.map(d => `
      <a href="/pages/destination-detail.html?id=${d.id}" class="card" style="text-decoration:none;color:inherit">
        <img class="card-img" src="${d.image_url}" alt="${d.name}" onerror="this.src='/images/placeholder.jpg'">
        <div class="card-body">
          <div class="card-tags">${diffBadge(d.difficulty)}<span class="badge badge-forest">WTF ${Number(d.wtf_score).toFixed(1)}</span></div>
          <h3 style="color:var(--forest);font-size:1.1rem;margin-bottom:4px">${d.name}</h3>
          <p style="font-size:.8rem">📍 ${d.location}</p>
        </div>
      </a>`).join('');
  }

  loadBookings();
</script>
</body>
</html>
