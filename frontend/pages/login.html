<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Hidden Gem Explorer</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-box">
    <div class="auth-header">
      <div class="auth-logo">🌊 Hidden Gem Explorer</div>
      <div class="auth-tagline">Masuk untuk melanjutkan petualanganmu</div>
    </div>
    <div class="auth-body">
      <div id="alertBox" class="alert hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="nama@email.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">Masuk</button>
      </form>
    </div>
    <div class="auth-footer">
      Belum punya akun? <a href="/pages/register.html">Daftar sekarang</a>
    </div>
  </div>
</div>
<script src="/js/app.js"></script>
<script>
  // Redirect if already logged in
  if (Auth.isLoggedIn()) window.location.href = dashboardHref(Auth.getUser()?.role);

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn   = document.getElementById('submitBtn');
    const alert = document.getElementById('alertBox');
    btn.disabled = true; btn.textContent = 'Memproses...';
    hideAlert(alert);

    const res = await api('/auth/login', {
      method: 'POST',
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });

    if (res.success) {
      Auth.setSession(res.data.token, res.data.user);
      toast('Login berhasil! Mengalihkan...', 'success');
      setTimeout(() => window.location.href = dashboardHref(res.data.user.role), 800);
    } else {
      showAlert(alert, res.message, 'error');
      btn.disabled = false; btn.textContent = 'Masuk';
    }
  });
</script>
</body>
</html>
