version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: hge_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: hidden_gem_explorer
      MYSQL_USER: hge_user
      MYSQL_PASSWORD: hge_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: hge_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: hge_user
      DB_PASSWORD: hge_password
      DB_NAME: hidden_gem_explorer
      JWT_SECRET: change_this_secret
      SESSION_SECRET: change_this_session_secret
    volumes:
      - ./frontend/images/uploads:/app/frontend/images/uploads
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: hge_nginx
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/images:/app/frontend/images
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:
