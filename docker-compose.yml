version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: hiddengem-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hiddengem-network

  app:
    build: .
    container_name: hiddengem-app
    restart: always
    env_file:
      - .env
    environment:
      - DB_HOST=db
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
    networks:
      - hiddengem-network

  nginx:
    image: nginx:alpine
    container_name: hiddengem-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hiddengem-network

volumes:
  mysql_data:

networks:
  hiddengem-network:
    driver: bridge